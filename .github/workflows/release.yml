name: Compilar y publicar Joaquincillo

# Cuándo se ejecuta:
#  - Al subir una etiqueta tipo v0.1.0  -> compila y publica una Release con el .msi.
#  - Manualmente (botón "Run workflow") -> compila y deja el instalador como artefacto
#    descargable, sin crear Release (útil para probar).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # necesario para crear la Release

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de Rust (acelera siguientes compilaciones)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias del proyecto
        run: npm install

      # Compila la app y, SI esto se lanzó por una etiqueta, crea la Release con el .msi.
      - name: Compilar Joaquincillo (+ Release si hay etiqueta)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Joaquincillo ${{ github.ref_name }}"
          releaseBody: "Instalador de Joaquincillo. Descarga el archivo .msi de abajo y ejecútalo."
          releaseDraft: false
          prerelease: false

      # En ejecuciones manuales (sin etiqueta) deja el instalador como artefacto descargable.
      - name: Subir instalador como artefacto (ejecución manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: joaquincillo-instalador
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
