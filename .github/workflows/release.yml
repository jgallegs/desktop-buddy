name: Compilar y publicar Joaquincillo

# Compila la app y publica el instalador de Velopack (con auto-update) en Releases.
#  - Al subir una etiqueta tipo v0.1.0  -> usa esa versión.
#  - Manualmente (Run workflow)         -> pides la versión en un campo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la v (p. ej. 0.1.0)"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # necesario para crear la Release

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar .NET 8 (lo necesita la herramienta vpk de Velopack)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Instalar la herramienta vpk
        run: dotnet tool install -g vpk

      - name: Determinar versión y etiqueta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = "${{ github.ref_name }}"
            $v = $tag -replace '^[vV]', ''        # quita la v inicial para Velopack
          } else {
            $v = "${{ github.event.inputs.version }}" -replace '^[vV]', ''
            $tag = "v$v"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "La versión '$v' no es SemVer de 3 partes (ej. 0.0.5). Pon solo numeros: X.Y.Z"
            exit 1
          }
          "VERSION=$v"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Versión: $v  Etiqueta: $tag"

      - name: Compilar Joaquincillo (release)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Preparar carpeta con el ejecutable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item "src-tauri/target/release/joaquincillo.exe" "publish/joaquincillo.exe"

      - name: Empaquetar con Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId Joaquincillo `
            --packVersion $env:VERSION `
            --packDir publish `
            --mainExe joaquincillo.exe `
            --packTitle "Joaquincillo" `
            --icon src-tauri/icons/icon.ico `
            --outputDir releases

      - name: Publicar la Release en GitHub
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github `
            --outputDir releases `
            --repoUrl "${{ github.server_url }}/${{ github.repository }}" `
            --publish `
            --releaseName "Joaquincillo $env:VERSION" `
            --tag $env:RELEASE_TAG `
            --token $env:GITHUB_TOKEN
